{% extends 'base.html' %}

{% block content %}
<section class="content-grid two-column">
    <article class="card">
        <div class="section-head">
            <div>
                <p class="label-text">Fusion Input</p>
                <h3>多源信息输入</h3>
            </div>
        </div>
        <form id="decisionForm" class="form-grid">
            <label class="field">
                <span>股票代码</span>
                <input id="decisionSymbol" type="text" value="600519.SH">
            </label>
            <label class="field">
                <span>情感记录</span>
                <select id="decisionSentimentRecord"></select>
            </label>
            <label class="field">
                <span>技术记录</span>
                <select id="decisionMarketRecord"></select>
            </label>
            <label class="field">
                <span>手动情感</span>
                <select id="decisionManualSentiment">
                    <option value="">跟随情感记录</option>
                    <option value="positive">正面</option>
                    <option value="neutral">中性</option>
                    <option value="negative">负面</option>
                </select>
            </label>
            <label class="field">
                <span>当前价格</span>
                <input id="decisionPrice" type="number" step="0.01">
            </label>
            <label class="field">
                <span>MA5</span>
                <input id="decisionMa5" type="number" step="0.01">
            </label>
            <label class="field">
                <span>RSI</span>
                <input id="decisionRsi" type="number" step="0.01">
            </label>
            <div class="button-row">
                <button class="primary-btn" type="submit">生成建议</button>
            </div>
        </form>
    </article>

    <article class="card">
        <div class="section-head">
            <div>
                <p class="label-text">Decision Output</p>
                <h3>决策结果</h3>
            </div>
        </div>
        <div id="decisionResult" class="result-panel empty-state">暂无决策结果</div>
    </article>
</section>

<section class="card">
    <div class="section-head">
        <div>
            <p class="label-text">History</p>
            <h3>最近决策建议记录</h3>
        </div>
    </div>
    <div id="decisionHistory" class="table-wrap"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
    window.PAGE_ENDPOINTS = {
        generate: "{{ url_for('project_decision_api.generate_decision') }}",
        history: "{{ url_for('project_decision_api.decision_history') }}",
        detailBase: "/api/decision/",
        sentimentHistory: "{{ url_for('project_sentiment_api.sentiment_history') }}",
        marketHistory: "{{ url_for('project_market_api.market_history') }}"
    };
</script>
<script src="{{ url_for('static', filename='project_decision.js') }}"></script>
{% endblock %}
