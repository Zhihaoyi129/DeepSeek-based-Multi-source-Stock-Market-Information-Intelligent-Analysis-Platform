{% extends 'base.html' %}

{% block content %}
<section class="content-grid two-column">
    <article class="card">
        <div class="section-head">
            <div>
                <p class="label-text">DeepSeek</p>
                <h3>DeepSeek 配置</h3>
            </div>
        </div>
        <form id="deepseekForm" class="form-grid">
            <label class="field">
                <span>启用状态</span>
                <select id="deepseekEnabled">
                    <option value="false">未启用</option>
                    <option value="true">启用</option>
                </select>
            </label>
            <label class="field">
                <span>Base URL</span>
                <input id="deepseekBaseUrl" type="text" placeholder="后续补充">
            </label>
            <label class="field">
                <span>API Key</span>
                <input id="deepseekApiKey" type="text" placeholder="后续补充">
            </label>
            <label class="field">
                <span>Model Name</span>
                <input id="deepseekModelName" type="text" placeholder="后续补充">
            </label>
            <label class="field field-full">
                <span>备注</span>
                <textarea id="deepseekRemark" rows="4" placeholder="说明当前接入策略"></textarea>
            </label>
            <div class="button-row">
                <button class="primary-btn" type="submit">保存 DeepSeek 配置</button>
            </div>
        </form>
    </article>

    <article class="card">
        <div class="section-head">
            <div>
                <p class="label-text">Market Source</p>
                <h3>行情数据源配置</h3>
            </div>
        </div>
        <form id="marketSourceForm" class="form-grid">
            <label class="field">
                <span>数据源</span>
                <select id="marketSourceProvider">
                    <option value="mock">Mock</option>
                    <option value="akshare">AKShare</option>
                    <option value="tushare">Tushare</option>
                </select>
            </label>
            <label class="field">
                <span>Token</span>
                <input id="marketSourceToken" type="text" placeholder="后续补充">
            </label>
            <label class="field field-full">
                <span>备注</span>
                <textarea id="marketSourceRemark" rows="4" placeholder="配置说明"></textarea>
            </label>
            <div class="button-row">
                <button class="primary-btn" type="submit">保存行情配置</button>
            </div>
        </form>
    </article>
</section>

<section class="card">
    <div class="section-head">
        <div>
            <p class="label-text">Runtime Status</p>
            <h3>系统运行状态</h3>
        </div>
    </div>
    <div id="settingsStatus" class="stack-list"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
    window.PAGE_ENDPOINTS = {
        settings: "{{ url_for('project_settings_api.get_settings') }}",
        deepseek: "{{ url_for('project_settings_api.update_deepseek_settings') }}",
        marketSource: "{{ url_for('project_settings_api.update_market_source_settings') }}",
        status: "{{ url_for('project_settings_api.system_status') }}"
    };
</script>
<script src="{{ url_for('static', filename='project_settings.js') }}"></script>
{% endblock %}
